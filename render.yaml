services:
  - type: web
    name: wealth-copilot-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run generate-data && npm run build
    startCommand: node api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: AI_EFFORT
        value: low
